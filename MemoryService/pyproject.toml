[project]
name = "cotabby-memory"
version = "0.1.0"
description = "Cotabby's local conversation memory: reads chat and mail history, indexes it with LEANN, and answers scoped retrieval queries over a Unix socket."
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    "leann==0.3.8",
]

[project.optional-dependencies]
# Microsoft Graph (Teams + Outlook) and Slack connectors. Kept optional so a local-only install
# (WhatsApp, Apple Mail, documents) never pulls network client libraries.
cloud = [
    "msal>=1.31",
    "msal-extensions>=1.2",
    "requests>=2.32",
]
dev = [
    "pytest>=8",
]

[project.scripts]
cotabby-memory = "cotabby_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotabby_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
